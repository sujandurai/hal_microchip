name: PIC32CM LS00 CI

on:
  push:
    branches:
      - patch-1
      - add-pic32cm5164ls00048
  pull_request:
  workflow_dispatch:

env:
  # Pin these so CI is reproducible instead of drifting with upstream.
  ZEPHYR_FORK_URL: https://github.com/sujandurai/zephyr-pic32cm5164ls00048.git
  ZEPHYR_FORK_BRANCH: pic32ls00-only
  ZEPHYR_SDK_VERSION: "0.17.0"
  BOARD: pic32cm_ls00_cnano

jobs:
  build:
    name: Build PIC32CM LS00
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout hal_microchip PR/fork
      # --------------------------------------------------
      - name: Checkout HAL
        uses: actions/checkout@v4
        with:
          path: hal_microchip_src
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install west
      # --------------------------------------------------
      - name: Install west
        run: |
          python -m pip install --upgrade pip
          pip install west

      # --------------------------------------------------
      # 4. Initialize a normal Zephyr workspace from upstream.
      #    (Your fork repo doesn't have a west.yml at its
      #    root, so it can't be used directly as a manifest
      #    repo -- it has to go in as the "zephyr" module
      #    instead, same as your original approach.)
      # --------------------------------------------------
      - name: Initialize Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr.git workspace

      # --------------------------------------------------
      # 5. Download Zephyr modules
      # --------------------------------------------------
      - name: Update Zephyr modules
        working-directory: workspace
        run: |
          west update --narrow -o=--depth=1

      # --------------------------------------------------
      # 5b. Swap in the PIC32CM LS00 Zephyr fork now, before
      #     installing requirements/exporting, so everything
      #     downstream uses the fork's code.
      #
      #     The fork branch is missing scripts/requirements.txt,
      #     so back up the upstream copy first and fall back to
      #     it if the fork doesn't ship its own.
      # --------------------------------------------------
      - name: Back up upstream requirements.txt
        working-directory: workspace
        run: |
          mkdir -p /tmp/zephyr-req-backup
          cp -r zephyr/scripts/requirements*.txt /tmp/zephyr-req-backup/ 2>/dev/null || true

      - name: Checkout PIC32CM LS00 Zephyr
        working-directory: workspace
        run: |
          rm -rf zephyr
          git clone --branch ${{ env.ZEPHYR_FORK_BRANCH }} ${{ env.ZEPHYR_FORK_URL }} zephyr

      - name: Restore requirements.txt if fork is missing it
        working-directory: workspace
        run: |
          if [ ! -f zephyr/scripts/requirements.txt ]; then
            echo "Fork branch has no scripts/requirements.txt -- using upstream copy instead."
            mkdir -p zephyr/scripts
            cp /tmp/zephyr-req-backup/*.txt zephyr/scripts/ 2>/dev/null || true
          fi
          ls -la zephyr/scripts/requirements*.txt

      # --------------------------------------------------
      # 6. Install Zephyr Python requirements
      # --------------------------------------------------
      - name: Install Zephyr requirements
        working-directory: workspace
        run: |
          pip install -r zephyr/scripts/requirements.txt

      # --------------------------------------------------
      # 7. Export Zephyr CMake package + install SDK/toolchain
      #    (this was missing before -- west build needs
      #    arm-zephyr-eabi-gcc for a Cortex-M0+ target)
      # --------------------------------------------------
      - name: Export Zephyr
        working-directory: workspace
        run: |
          west zephyr-export

      - name: Install Zephyr SDK toolchain
        working-directory: workspace/zephyr
        run: |
          west sdk install --toolchains arm-zephyr-eabi --version ${{ env.ZEPHYR_SDK_VERSION }}

      # --------------------------------------------------
      # 8. Replace Microchip HAL module with current PR code
      # --------------------------------------------------
      - name: Use HAL PR code
        run: |
          rm -rf workspace/modules/hal/microchip
          mkdir -p workspace/modules/hal/microchip
          git -C hal_microchip_src archive HEAD | tar -x -C workspace/modules/hal/microchip

      # --------------------------------------------------
      # 9. Sanity checks: board + SoC show up after the HAL swap
      # --------------------------------------------------
      - name: Check PIC32CM LS00 board is registered
        working-directory: workspace
        run: |
          west boards | grep -i pic32cm

      - name: Show versions
        working-directory: workspace
        run: |
          west --version
          python --version
          git --version
          arm-zephyr-eabi-gcc --version || true

      # --------------------------------------------------
      # 10. Build a small spread of samples, the way other
      #     Microchip SAM/PIC32 boards are smoke-tested --
      #     not just blinky, so GPIO/console/driver init
      #     paths in the new HAL get exercised too.
      # --------------------------------------------------
      - name: Build blinky
        working-directory: workspace
        run: |
          west build -p always -b ${{ env.BOARD }} zephyr/samples/basic/blinky -d build/blinky

      - name: Build button
        working-directory: workspace
        run: |
          west build -p always -b ${{ env.BOARD }} zephyr/samples/basic/button -d build/button

      - name: Build hello_world
        working-directory: workspace
        run: |
          west build -p always -b ${{ env.BOARD }} zephyr/samples/hello_world -d build/hello_world

      # --------------------------------------------------
      # 11. Optional: run twister for a broader automated
      #     sweep instead of hand-picking samples. Uncomment
      #     once the board has enough driver coverage to be
      #     worth it; keeps this job fast until then.
      # --------------------------------------------------
      # - name: Run twister for this board
      #   working-directory: workspace
      #   run: |
      #     python zephyr/scripts/twister -p ${{ env.BOARD }} \
      #       -T zephyr/samples/basic \
      #       --inline-logs -v

      # --------------------------------------------------
      # 12. Upload build artifacts for inspection on failure
      # --------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pic32cm-ls00-build-logs
          path: |
            workspace/build/*/build.log
            workspace/build/*/CMakeCache.txt
          if-no-files-found: ignore
