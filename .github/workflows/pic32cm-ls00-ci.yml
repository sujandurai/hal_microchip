name: PIC32CM LS00 CI

on:
  push:
    branches:
      - patch-1
      - add-pic32cm5164ls00048

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build PIC32CM LS00
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout hal_microchip PR/fork
      # --------------------------------------------------
      - name: Checkout HAL
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install west
      # --------------------------------------------------
      - name: Install west
        run: |
          python -m pip install --upgrade pip
          pip install west

      # --------------------------------------------------
      # 4. Initialize a normal Zephyr workspace
      # --------------------------------------------------
      - name: Initialize Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr.git

      # --------------------------------------------------
      # 5. Download Zephyr modules
      # --------------------------------------------------
      - name: Update Zephyr modules
        run: |
          west update

      # --------------------------------------------------
      # 6. Replace upstream Zephyr with PIC32CM LS00 fork
      # --------------------------------------------------
      - name: Checkout PIC32CM LS00 Zephyr
        run: |
          rm -rf zephyr

          git clone \
            --branch pic32ls00-only \
            https://github.com/sujandurai/zephyr-pic32cm5164ls00048.git \
            zephyr

      # --------------------------------------------------
      # 7. Install Zephyr Python requirements
      # --------------------------------------------------
      - name: Install Zephyr requirements
        run: |
          pip install -r zephyr/scripts/requirements.txt

      # --------------------------------------------------
      # 8. Export Zephyr environment
      # --------------------------------------------------
      - name: Export Zephyr
        run: |
          west zephyr-export

      # --------------------------------------------------
      # 9. Replace Microchip HAL with current PR code
      # --------------------------------------------------
      - name: Use HAL PR code
        run: |
          rm -rf modules/hal/microchip
          mkdir -p modules/hal/microchip

          git archive HEAD | tar -x -C modules/hal/microchip

      # --------------------------------------------------
      # 10. Check that PIC32CM LS00 board is detected
      # --------------------------------------------------
      - name: Check PIC32CM LS00 board
        run: |
          west boards | grep -i pic32cm

      # --------------------------------------------------
      # 11. Show important versions
      # --------------------------------------------------
      - name: Show versions
        run: |
          west --version
          python --version
          git --version

      # --------------------------------------------------
      # 12. Build PIC32CM LS00 blinky
      # --------------------------------------------------
      - name: Build PIC32CM LS00 blinky
        run: |
          west build -p always \
            -b pic32cm_ls00_cnano \
            zephyr/samples/basic/blinky
